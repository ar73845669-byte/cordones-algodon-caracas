<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="macrameBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FCFAF7" />
      <stop offset="60%" stop-color="#F3EBE0" />
      <stop offset="100%" stop-color="#E1D3C2" />
    </radialGradient>

    <linearGradient id="woodBranch" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4E342E" />
      <stop offset="50%" stop-color="#795548" />
      <stop offset="100%" stop-color="#3E2723" />
    </linearGradient>

    <linearGradient id="cottonCordBeige" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F0" />
      <stop offset="50%" stop-color="#E8DCB8" />
      <stop offset="100%" stop-color="#CBB48C" />
    </linearGradient>

    <linearGradient id="terracottaAccentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97A5E" />
      <stop offset="100%" stop-color="#A95239" />
    </linearGradient>

    <linearGradient id="mustardGoldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5B887" />
      <stop offset="100%" stop-color="#D4A373" />
    </linearGradient>

    <filter id="macrameShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#3E2723" flood-opacity="0.22" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#macrameBg)" />

  <!-- Natural Wooden Dowel / Branch Hanging Bar -->
  <g filter="url(#macrameShadow)">
    <!-- Branch -->
    <rect x="60" y="70" width="480" height="24" rx="10" fill="url(#woodBranch)" />
    <!-- Natural knots on branch -->
    <ellipse cx="140" cy="82" rx="4" ry="7" fill="#2B1B17" opacity="0.6" />
    <ellipse cx="380" cy="80" rx="6" ry="9" fill="#2B1B17" opacity="0.5" />
    
    <!-- Top Hanging Cord Triangle -->
    <path d="M 120,70 L 300,18 L 480,70" fill="none" stroke="url(#cottonCordBeige)" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Hanging Macramé Knots & Geometric Diamond Grid -->
  <g transform="translate(0, 94)" filter="url(#macrameShadow)">
    
    <!-- Top Loops Mounted to Branch (Lark's Head Knots) -->
    <g fill="url(#cottonCordBeige)" stroke="#B39B72" stroke-width="1.5">
      <!-- 8 Knot Mounts -->
      <rect x="110" y="0" width="30" height="22" rx="6" />
      <rect x="160" y="0" width="30" height="22" rx="6" />
      <rect x="210" y="0" width="30" height="22" rx="6" />
      <rect x="260" y="0" width="30" height="22" rx="6" />
      <rect x="310" y="0" width="30" height="22" rx="6" />
      <rect x="360" y="0" width="30" height="22" rx="6" />
      <rect x="410" y="0" width="30" height="22" rx="6" />
      <rect x="460" y="0" width="30" height="22" rx="6" />
    </g>

    <!-- Braided Cord Strands descending into diamond pattern -->
    <!-- Diamond Row 1 -->
    <g stroke="url(#cottonCordBeige)" stroke-width="7" stroke-linecap="round">
      <line x1="125" y1="22" x2="185" y2="90" />
      <line x1="175" y1="22" x2="135" y2="90" />
      
      <line x1="225" y1="22" x2="285" y2="90" />
      <line x1="275" y1="22" x2="235" y2="90" />

      <line x1="325" y1="22" x2="385" y2="90" />
      <line x1="375" y1="22" x2="335" y2="90" />

      <line x1="425" y1="22" x2="485" y2="90" />
      <line x1="475" y1="22" x2="435" y2="90" />
    </g>

    <!-- Square Knot Beads (Center Diamonds) in Terracotta and Beige -->
    <g transform="translate(0, 85)">
      <!-- Central Large Diamond Structure -->
      <path d="M 300,10 L 220,95 L 300,180 L 380,95 Z" fill="none" stroke="url(#terracottaAccentGrad)" stroke-width="8" stroke-linejoin="round" />
      
      <!-- Inner diamond -->
      <path d="M 300,35 L 245,95 L 300,155 L 355,95 Z" fill="none" stroke="url(#mustardGoldGrad)" stroke-width="6" stroke-linejoin="round" />
      
      <!-- Center Spiral Knot -->
      <circle cx="300" cy="95" r="16" fill="url(#cottonCordBeige)" stroke="#3E2723" stroke-width="2" />
      <circle cx="300" cy="95" r="7" fill="#6B2D5C" />

      <!-- Side Chevron Lines -->
      <path d="M 160,35 L 220,95 L 160,155" fill="none" stroke="url(#cottonCordBeige)" stroke-width="7" stroke-linecap="round" />
      <path d="M 440,35 L 380,95 L 440,155" fill="none" stroke="url(#cottonCordBeige)" stroke-width="7" stroke-linecap="round" />
    </g>

    <!-- Cascading Fringe & Tassels (Flecos de Algodón con Alma Deshilachada Artesanal) -->
    <g transform="translate(0, 275)" stroke-linecap="round">
      <!-- Main hanging cords with knots -->
      <line x1="140" y1="0" x2="140" y2="120" stroke="url(#cottonCordBeige)" stroke-width="7" />
      <line x1="170" y1="0" x2="170" y2="140" stroke="url(#cottonCordBeige)" stroke-width="7" />
      <line x1="200" y1="0" x2="200" y2="170" stroke="url(#cottonCordBeige)" stroke-width="7" />
      <line x1="230" y1="0" x2="230" y2="195" stroke="url(#cottonCordBeige)" stroke-width="7" />
      <line x1="260" y1="0" x2="260" y2="215" stroke="url(#cottonCordBeige)" stroke-width="7" />
      
      <!-- Center Peak Fringe -->
      <line x1="300" y1="0" x2="300" y2="230" stroke="url(#terracottaAccentGrad)" stroke-width="8" />

      <line x1="340" y1="0" x2="340" y2="215" stroke="url(#cottonCordBeige)" stroke-width="7" />
      <line x1="370" y1="0" x2="370" y2="195" stroke="url(#cottonCordBeige)" stroke-width="7" />
      <line x1="400" y1="0" x2="400" y2="170" stroke="url(#cottonCordBeige)" stroke-width="7" />
      <line x1="430" y1="0" x2="430" y2="140" stroke="url(#cottonCordBeige)" stroke-width="7" />
      <line x1="460" y1="0" x2="460" y2="120" stroke="url(#cottonCordBeige)" stroke-width="7" />

      <!-- Wooden Beads strung on cords -->
      <ellipse cx="200" cy="70" rx="9" ry="12" fill="#D4A373" stroke="#3E2723" stroke-width="1.5" />
      <ellipse cx="400" cy="70" rx="9" ry="12" fill="#D4A373" stroke="#3E2723" stroke-width="1.5" />
      <ellipse cx="300" cy="110" rx="12" ry="15" fill="#C86D51" stroke="#3E2723" stroke-width="1.5" />
    </g>
  </g>

  <!-- Artisan Note Card Overlay -->
  <g transform="translate(320, 480)">
    <rect width="245" height="85" rx="10" fill="#3E2723" filter="url(#macrameShadow)" />
    <text x="16" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#D4A373" letter-spacing="1">MACRAMÉ &amp; DECORACIÓN</text>
    <text x="16" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#FCFAF7">Nudos Firmes y Definidos</text>
    <text x="16" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#FAF5EE" opacity="0.8">El alma interior evita que el tejido cuelgue aguado</text>
  </g>
</svg>
