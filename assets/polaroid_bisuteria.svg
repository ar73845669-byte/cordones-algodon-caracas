<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="jewelBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FAF5EE" />
      <stop offset="65%" stop-color="#EDE2D2" />
      <stop offset="100%" stop-color="#D9C6AF" />
    </radialGradient>

    <linearGradient id="brassGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6" />
      <stop offset="35%" stop-color="#E5BA73" />
      <stop offset="70%" stop-color="#C58940" />
      <stop offset="100%" stop-color="#805018" />
    </linearGradient>

    <linearGradient id="cordWine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8E3B7D" />
      <stop offset="50%" stop-color="#6B2D5C" />
      <stop offset="100%" stop-color="#421438" />
    </linearGradient>

    <linearGradient id="cordBeige" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="50%" stop-color="#E7DBBA" />
      <stop offset="100%" stop-color="#B8A37A" />
    </linearGradient>

    <filter id="jewelShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#3E2723" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#jewelBg)" />

  <!-- Marble & Wood Presentation Dish Ring -->
  <circle cx="300" cy="300" r="230" fill="#F8F3EC" stroke="#D4A373" stroke-width="2" filter="url(#jewelShadow)" />
  <circle cx="300" cy="300" r="215" fill="none" stroke="#C86D51" stroke-width="0.75" stroke-dasharray="6 4" opacity="0.4" />

  <!-- Outer Braided Bracelet (Vinotinto Soft Wine) -->
  <g filter="url(#jewelShadow)">
    <circle cx="300" cy="300" r="160" fill="none" stroke="#3E2723" stroke-width="22" opacity="0.2" />
    <circle cx="300" cy="300" r="160" fill="none" stroke="url(#cordWine)" stroke-width="18" />
    <!-- Braided texture dash -->
    <circle cx="300" cy="300" r="160" fill="none" stroke="#FAF0EA" stroke-width="3" stroke-dasharray="6 8" opacity="0.75" />
    
    <!-- Nautical Anchor Clasp (Brass) -->
    <g transform="translate(300, 140)">
      <circle cx="0" cy="0" r="12" fill="url(#brassGold)" stroke="#3E2723" stroke-width="1.5" />
      <rect x="-8" y="-6" width="16" height="12" rx="3" fill="#3E2723" />
      <path d="M -22,14 C -12,28 12,28 22,14" fill="none" stroke="url(#brassGold)" stroke-width="5" stroke-linecap="round" />
      <line x1="0" y1="0" x2="0" y2="24" stroke="url(#brassGold)" stroke-width="5" />
      <line x1="-12" y1="8" x2="12" y2="8" stroke="url(#brassGold)" stroke-width="4" stroke-linecap="round" />
    </g>
  </g>

  <!-- Inner Double Wrapped Braided Bracelet (Beige Natural & Terracotta) -->
  <g filter="url(#jewelShadow)">
    <circle cx="300" cy="300" r="110" fill="none" stroke="#3E2723" stroke-width="18" opacity="0.15" />
    <circle cx="300" cy="300" r="110" fill="none" stroke="url(#cordBeige)" stroke-width="15" />
    <circle cx="300" cy="300" r="110" fill="none" stroke="#FFF" stroke-width="2.5" stroke-dasharray="5 7" opacity="0.85" />
    
    <circle cx="300" cy="300" r="88" fill="none" stroke="#C86D51" stroke-width="12" />
    <circle cx="300" cy="300" r="88" fill="none" stroke="#D4A373" stroke-width="2" stroke-dasharray="4 6" opacity="0.7" />

    <!-- Magnetic Brass Cylindrical Clasp -->
    <g transform="translate(300, 400)">
      <rect x="-24" y="-12" width="48" height="24" rx="7" fill="url(#brassGold)" stroke="#3E2723" stroke-width="1.5" />
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#3E2723" stroke-width="1.5" />
      <circle cx="-12" cy="0" r="3" fill="#3E2723" opacity="0.6" />
      <circle cx="12" cy="0" r="3" fill="#3E2723" opacity="0.6" />
    </g>
  </g>

  <!-- Center Decorative Gem / Wooden Bead -->
  <circle cx="300" cy="300" r="42" fill="#3E2723" filter="url(#jewelShadow)" />
  <circle cx="300" cy="300" r="38" fill="#4E342E" stroke="#D4A373" stroke-width="1.5" />
  <circle cx="300" cy="300" r="24" fill="#6B2D5C" />
  <text x="300" y="306" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#D4A373" text-anchor="middle">H&amp;A</text>

  <!-- Label Badge -->
  <g transform="translate(330, 485)">
    <rect width="230" height="75" rx="10" fill="#3E2723" filter="url(#jewelShadow)" />
    <text x="16" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#D4A373" letter-spacing="1">BISUTERÍA &amp; ACCESORIOS</text>
    <text x="16" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#FCFAF7">Pulseras &amp; Llaveros</text>
    <text x="16" y="63" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#FAF5EE" opacity="0.8">Tacto suave que no deshilacha</text>
  </g>
</svg>
