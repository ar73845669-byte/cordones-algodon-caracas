<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="60%" stop-color="#F2EAE1" />
      <stop offset="100%" stop-color="#E2D4C3" />
    </radialGradient>

    <!-- Braided Cord Gradient Beige -->
    <linearGradient id="cordBeige" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F0" />
      <stop offset="35%" stop-color="#E8DCB8" />
      <stop offset="70%" stop-color="#D4C29B" />
      <stop offset="100%" stop-color="#B39B72" />
    </linearGradient>

    <!-- Inner Core Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E0E0E0" />
      <stop offset="100%" stop-color="#BDBDBD" />
    </linearGradient>

    <!-- Terracotta Accent -->
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C86D51" />
      <stop offset="100%" stop-color="#A95239" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="cordShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#3E2723" flood-opacity="0.25" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Braided Pattern Tile for Cotton Weave -->
    <pattern id="braidTexture" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="24" height="24" fill="#FAF6F0" />
      <path d="M0,0 L12,12 L0,24 Z" fill="#E8DCB8" opacity="0.75" />
      <path d="M12,0 L24,12 L12,24 Z" fill="#D4C29B" opacity="0.65" />
      <path d="M0,12 L12,0 L24,12 L12,24 Z" stroke="#CBB48C" stroke-width="1.2" fill="none" opacity="0.6" />
      <line x1="2" y1="2" x2="10" y2="10" stroke="#FFF" stroke-width="0.8" opacity="0.8" />
      <line x1="14" y1="2" x2="22" y2="10" stroke="#FFF" stroke-width="0.8" opacity="0.8" />
    </pattern>

    <!-- Dark Jacquard Pattern Tile -->
    <pattern id="jacquardWeaveBg" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 20 L20 0 L40 20 L20 40 Z" fill="none" stroke="#D4A373" stroke-width="0.5" opacity="0.15" />
      <circle cx="20" cy="20" r="1.5" fill="#C86D51" opacity="0.2" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgGlow)" />
  <rect width="600" height="600" fill="url(#jacquardWeaveBg)" />

  <!-- Ambient Shadow Under Cords -->
  <ellipse cx="300" cy="420" rx="220" ry="40" fill="#3E2723" opacity="0.12" filter="url(#softGlow)" />

  <!-- Curved Main Braided Cotton Cord Strand -->
  <g filter="url(#cordShadow)">
    <!-- Base Tube Path -->
    <path d="M -40,380 C 120,440 180,180 320,200 C 440,220 520,380 640,330" 
          fill="none" stroke="#3E2723" stroke-width="54" stroke-linecap="round" opacity="0.3" />
    
    <path d="M -40,370 C 120,430 180,170 320,190 C 440,210 520,370 640,320" 
          fill="none" stroke="url(#cordBeige)" stroke-width="50" stroke-linecap="round" />

    <!-- Repeated Braided Strands Over the Curve to simulate actual diamond braid -->
    <!-- Weave loops -->
    <path d="M -30,365 C 50,420 120,340 180,260 C 240,180 340,170 420,240 C 490,300 550,330 630,315" 
          fill="none" stroke="#FAF8F5" stroke-width="6" stroke-dasharray="14 16" opacity="0.85" />
    
    <path d="M -30,375 C 50,430 120,350 180,270 C 240,190 340,180 420,250 C 490,310 550,340 630,325" 
          fill="none" stroke="#B89B6A" stroke-width="7" stroke-dasharray="12 18" stroke-dashoffset="8" opacity="0.75" />

    <path d="M -30,370 C 50,425 120,345 180,265 C 240,185 340,175 420,245 C 490,305 550,335 630,320" 
          fill="none" stroke="url(#terracottaGrad)" stroke-width="3" stroke-dasharray="8 22" opacity="0.4" />
  </g>

  <!-- Second Crossing Braided Cord (Terracotta Accent) -->
  <g filter="url(#cordShadow)">
    <path d="M 100,540 C 220,480 240,290 380,140 C 460,50 560,90 620,120" 
          fill="none" stroke="#2B1B17" stroke-width="44" stroke-linecap="round" opacity="0.25" />
    <path d="M 100,530 C 220,470 240,280 380,130 C 460,40 560,80 620,110" 
          fill="none" stroke="url(#terracottaGrad)" stroke-width="40" stroke-linecap="round" />
    <path d="M 100,530 C 220,470 240,280 380,130 C 460,40 560,80 620,110" 
          fill="none" stroke="#FAF6F0" stroke-width="5" stroke-dasharray="10 16" opacity="0.6" />
    <path d="M 100,530 C 220,470 240,280 380,130 C 460,40 560,80 620,110" 
          fill="none" stroke="#6B2D5C" stroke-width="4" stroke-dasharray="12 20" stroke-dashoffset="6" opacity="0.45" />
  </g>

  <!-- Cut-Away Section Revealing the "Alma" (Internal High-Tenacity Core) -->
  <g transform="translate(195, 245) rotate(-28)" filter="url(#cordShadow)">
    <!-- Outer Cotton Braided Sheath cut -->
    <ellipse cx="0" cy="0" rx="30" ry="22" fill="#E8DCB8" stroke="#3E2723" stroke-width="2.5" />
    <ellipse cx="0" cy="0" rx="27" ry="19" fill="#B39B72" />
    <!-- Individual outer braided strand ends -->
    <circle cx="-18" cy="-5" r="4" fill="#FAF6F0" stroke="#CBB48C" />
    <circle cx="-14" cy="9" r="4" fill="#E8DCB8" stroke="#CBB48C" />
    <circle cx="2" cy="14" r="4" fill="#FAF6F0" stroke="#CBB48C" />
    <circle cx="16" cy="7" r="4" fill="#E8DCB8" stroke="#CBB48C" />
    <circle cx="18" cy="-7" r="4" fill="#FAF6F0" stroke="#CBB48C" />
    <circle cx="2" cy="-14" r="4" fill="#D4C29B" stroke="#CBB48C" />

    <!-- Inner Core ("ALMA") Protruding -->
    <path d="M -10,-8 L -15,-40 L 12,-40 L 10,-8 Z" fill="url(#coreGrad)" stroke="#3E2723" stroke-width="1.5" />
    <!-- Core micro fibers -->
    <line x1="-8" y1="-8" x2="-12" y2="-38" stroke="#FFFFFF" stroke-width="2" />
    <line x1="-2" y1="-8" x2="-4" y2="-39" stroke="#E0E0E0" stroke-width="2" />
    <line x1="4" y1="-8" x2="3" y2="-39" stroke="#FFFFFF" stroke-width="2" />
    <line x1="8" y1="-8" x2="9" y2="-38" stroke="#D0D0D0" stroke-width="2" />

    <!-- Top of Core Core Cut -->
    <ellipse cx="-1.5" cy="-40" rx="13.5" ry="5.5" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="1.5" />
    <ellipse cx="-1.5" cy="-40" rx="9" ry="3.5" fill="#EBEBEB" />
  </g>

  <!-- Technical Callout Badge: "ALMA REFORZADA" -->
  <g transform="translate(130, 110)">
    <!-- Pointer Line -->
    <path d="M 75,55 L 75,100 L 65,115" fill="none" stroke="#C86D51" stroke-width="2" stroke-dasharray="4 3" />
    <circle cx="65" cy="115" r="4" fill="#C86D51" />

    <!-- Card Badge -->
    <rect x="0" y="0" width="165" height="52" rx="8" fill="#3E2723" filter="url(#cordShadow)" />
    <rect x="2" y="2" width="161" height="48" rx="6" fill="#4E342E" />
    <text x="12" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#D4A373" letter-spacing="1.5">NÚCLEO INTERNO</text>
    <text x="12" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#FAF6F0">ALMA ANTI-DEFORMACIÓN</text>
  </g>

  <!-- Macro Specification Watermark Card -->
  <g transform="translate(360, 470)">
    <rect width="210" height="95" rx="12" fill="#FAF7F5" stroke="#D4A373" stroke-width="1.5" filter="url(#cordShadow)" opacity="0.96" />
    <text x="18" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#3E2723">MACRO DETALLE 6MM</text>
    <text x="18" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#C86D51">100% Algodón Trenzado</text>
    <text x="18" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#3E2723" opacity="0.8">Trama de 16 husos en cruz</text>
    <text x="18" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#6B2D5C">Importado · Caracas Stock</text>
  </g>
</svg>
